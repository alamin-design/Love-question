    @media(max-width:620px){.shell{width:min(calc(100% - 20px),520px);padding-top:16px}.micro{font-size:8px}.card{border-radius:22px;padding:42px 17px 34px}.choices{min-height:305px;margin-top:26px}.yes,.no{width:128px}.yes{left:27%}.no{left:73%}.meme{min-width:min(100%,290px);padding:7px 10px}.meme p{font-size:13px}.cert-paper{grid-template-columns:1fr}.actions{flex-direction:column-reverse}.actions button{width:100%}.one{left:2%;font-size:30px}.two{right:3%;font-size:30px}}

  const state = { name:"", no:0, x:69, y:58, signed:false };

  const safe = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
